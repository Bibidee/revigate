name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --frozen
      - name: Prepare the pinned GenVM Direct Mode runtime
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          tarball="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          if [[ ! -f "$tarball" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              --output "$tarball"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $tarball" | sha256sum --check
      - run: npm run preflight
      - run: npm audit --omit=dev --audit-level=high
