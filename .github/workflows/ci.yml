name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --frozen
      - name: Prepare the GenVM runtime pinned by Direct Mode tests
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          tarball="$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
          if [[ ! -f "$tarball" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz \
              --output "$tarball"
          fi
          echo "4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2  $tarball" | sha256sum --check
      - run: npm run preflight
      - run: npm audit --omit=dev --audit-level=high
